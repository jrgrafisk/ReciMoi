# Bygger iPhone-genvejen og signerer den på en virtuel Mac (Apple kræver signering for at kunne installere den).
name: Genvej
on:
  push:
    branches: [main]
    paths: [tools/**, .github/workflows/shortcut.yml]
  workflow_dispatch:
jobs:
  sign:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/make_shortcut.py ReciMoi-unsigned.shortcut
      - name: Signér
        run: |
          for mode in anyone people-who-know-me; do
            if out=$(shortcuts sign --mode "$mode" --input ReciMoi-unsigned.shortcut --output ReciMoi.shortcut 2>&1); then
              echo "::notice::Signeret ($mode)"; exit 0
            fi
            echo "::warning::sign $mode fejlede: $(echo "$out" | grep -v 'Unrecognized attribute' | tr '\n' ' ' | tail -c 600)"
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genvej
          path: "*.shortcut"
