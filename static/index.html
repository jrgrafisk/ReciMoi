<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReciMoi</title>
<meta name="description" content="Gem opskrifter fra Instagram – kun på din telefon.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<p id="backupNote" class="note" hidden>Dine opskrifter ligger kun på denne telefon. Tag en backup en gang imellem:
  <button id="backupNow" type="button" class="link">Download backup nu</button></p>

<div id="view"></div>

<nav id="tabs" aria-label="Hovedmenu">
  <a href="#/" data-tab="list">Opskrifter</a>
  <a href="#/new" data-tab="new">＋ Ny</a>
  <a href="#/shop" data-tab="shop">Indkøb <span id="badge" hidden></span></a>
</nav>

<div id="toast" role="status" hidden></div>

<dialog id="picker">
  <h2>Vælg kategori</h2>
  <p id="pickerInfo" class="muted"></p>
  <div id="pickerList" class="grid"></div>
  <form id="newCat" autocomplete="off">
    <input id="newCatName" placeholder="Ny kategori…" aria-label="Ny kategori">
    <button type="submit">Opret</button>
  </form>
  <button id="pickerClose" class="link" type="button">Spring over</button>
</dialog>

<dialog id="cats">
  <h2>Kategorier</h2>
  <ul id="catList"></ul>
  <form id="newCat2" autocomplete="off">
    <input id="newCat2Name" placeholder="Ny kategori…" aria-label="Ny kategori">
    <button type="submit">Opret</button>
  </form>
  <button id="catsClose" class="link" type="button">Luk</button>
</dialog>

<input type="file" id="import" accept="application/json,.json" hidden>

<script src="parse.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
